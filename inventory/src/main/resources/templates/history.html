<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activity History - IMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --sidebar-bg: #0f172a; 
            --sidebar-hover: #1e293b; 
            --primary-color: #3b82f6; 
            --bg-color: #f1f5f9; 
            --text-dark: #1e293b; 
            --text-muted: #64748b; 
        }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; color: var(--text-dark); }
        .sidebar { background-color: var(--sidebar-bg); color: #fff; height: 100vh; width: 260px; position: fixed; padding-top: 20px; overflow-y: auto; }
        .sidebar h4 { text-align: center; color: var(--primary-color); font-weight: 700; margin-bottom: 20px; }
        .user-badge-box { background: rgba(255, 255, 255, 0.07); margin: 0 15px 25px 15px; padding: 12px; border-radius: 12px; text-align: center; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 11px 25px; display: flex; align-items: center; transition: 0.3s; font-size: 0.95rem; }
        .sidebar a:hover, .sidebar a.active { background-color: var(--sidebar-hover); color: #fff; border-left: 4px solid var(--primary-color); }
        .sidebar i { margin-right: 15px; font-size: 1.2rem; }
        .main-content { margin-left: 260px; padding: 40px; }
        .card-custom { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 25px; }
        .table thead th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.85rem; border-bottom: 2px solid #e2e8f0; padding: 14px; }
        .table tbody td { padding: 14px; vertical-align: middle; border-bottom: 1px solid #e2e8f0; font-size: 0.92rem; }
        .table tbody tr:hover { background-color: #f8fafc; }
        .badge-create { background-color: #10b981; color: white; }
        .badge-update { background-color: #3b82f6; color: white; }
        .badge-delete { background-color: #ef4444; color: white; }
        .badge-login { background-color: #8b5cf6; color: white; }
        .badge-register { background-color: #f59e0b; color: white; }
        .badge-logout { background-color: #64748b; color: white; }
        .search-box { border-radius: 8px; border: 1px solid #e2e8f0; padding: 10px 15px; width: 320px; }
        .search-box:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); outline: none; }
        .btn-filter { border-radius: 8px; padding: 6px 14px; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h4><i class="bi bi-box-seam"></i> IMS</h4>
        
        <div class="user-badge-box">
            <div class="fw-bold text-white small" id="currentUserName">User</div>
            <span class="badge bg-primary mt-1" id="currentUserRole">USER</span>
        </div>

        <a href="/dashboard" id="navDashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/products"><i class="bi bi-box"></i> Products</a>
        <a href="/orders" id="navOrders"><i class="bi bi-cart-check"></i> Orders & Sales</a>
        <a href="/purchases" id="navPurchases"><i class="bi bi-bag-plus"></i> Purchases</a>
        <a href="/categories" id="navCategories"><i class="bi bi-tags"></i> Categories</a>
        <a href="/suppliers" id="navSuppliers"><i class="bi bi-truck"></i> Suppliers</a>
        <a href="/users" id="navUsers"><i class="bi bi-people"></i> Users</a>
        <a href="/reports" id="navReports"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
        <a href="/history" class="active"><i class="bi bi-clock-history"></i> History</a>
        <hr style="border-color: #334155; margin: 15px 20px;">
        <a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-clock-history text-primary me-2"></i>Activity History</h2>
                <p class="text-muted mb-0">Audit log of all actions, modifications, additions, and deletions</p>
            </div>
            <button class="btn btn-outline-primary" onclick="loadHistory()">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>

        <div class="card-custom">
            <!-- Search & Filters -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search history logs...">
                
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-secondary btn-filter active" onclick="filterAction('ALL')">All</button>
                    <button type="button" class="btn btn-outline-success btn-filter" onclick="filterAction('CREATE')">Created</button>
                    <button type="button" class="btn btn-outline-primary btn-filter" onclick="filterAction('UPDATE')">Updated</button>
                    <button type="button" class="btn btn-outline-danger btn-filter" onclick="filterAction('DELETE')">Deleted</button>
                    <button type="button" class="btn btn-outline-info btn-filter" onclick="filterAction('LOGIN')">Logins</button>
                </div>
                
                <span class="text-muted" id="recordCount">0 events recorded</span>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover" id="historyTable">
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Timestamp</th>
                            <th>Action</th>
                            <th>Entity</th>
                            <th>Item Name</th>
                            <th>Details</th>
                            <th>Performed By</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
            <div id="loadingSpinner" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allLogs = [];
        let currentFilter = 'ALL';

        document.addEventListener('DOMContentLoaded', async () => {
            setupUserSession();
            await loadHistory();
        });

        function setupUserSession() {
            try {
                const stored = localStorage.getItem('currentUser');
                if (stored) {
                    const u = JSON.parse(stored);
                    document.getElementById('currentUserName').textContent = u.username;
                    document.getElementById('currentUserRole').textContent = (u.role === 'ADMIN') ? 'ADMIN' : 'CUSTOMER';
                    document.getElementById('currentUserRole').className = u.role === 'ADMIN' ? 'badge bg-danger' : 'badge bg-primary';

                    if (u.role !== 'ADMIN') {
                        // User view: hide admin-only links
                        ['navDashboard', 'navCategories', 'navSuppliers', 'navPurchases', 'navUsers', 'navReports'].forEach(id => {
                            const el = document.getElementById(id);
                            if (el) el.classList.add('d-none');
                        });
                    }
                }
            } catch (e) {}
        }

        async function loadHistory() {
            const tableBody = document.getElementById('historyTableBody');
            const spinner = document.getElementById('loadingSpinner');
            tableBody.innerHTML = '';
            spinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/history');
                allLogs = await response.json();
                spinner.classList.add('d-none');
                renderLogs();
            } catch (err) {
                spinner.classList.add('d-none');
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Failed to load history logs.</td></tr>';
            }
        }

        function filterAction(action) {
            currentFilter = action;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderLogs();
        }

        function renderLogs() {
            const tableBody = document.getElementById('historyTableBody');
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            tableBody.innerHTML = '';

            const filtered = allLogs.filter(log => {
                const matchesAction = (currentFilter === 'ALL') || (log.actionType === currentFilter);
                const matchesSearch = !searchValue || 
                    (log.entityName && log.entityName.toLowerCase().includes(searchValue)) ||
                    (log.performedBy && log.performedBy.toLowerCase().includes(searchValue)) ||
                    (log.details && log.details.toLowerCase().includes(searchValue)) ||
                    (log.actionType && log.actionType.toLowerCase().includes(searchValue));
                return matchesAction && matchesSearch;
            });

            document.getElementById('recordCount').textContent = `${filtered.length} events`;

            if (filtered.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No activity records found.</td></tr>';
                return;
            }

            filtered.forEach(log => {
                let badgeClass = 'bg-secondary';
                if (log.actionType === 'CREATE') badgeClass = 'badge-create';
                else if (log.actionType === 'UPDATE') badgeClass = 'badge-update';
                else if (log.actionType === 'DELETE') badgeClass = 'badge-delete';
                else if (log.actionType === 'LOGIN') badgeClass = 'badge-login';
                else if (log.actionType === 'REGISTER') badgeClass = 'badge-register';
                else if (log.actionType === 'LOGOUT') badgeClass = 'badge-logout';

                const formattedDate = log.timestamp ? new Date(log.timestamp).toLocaleString() : '-';

                const row = `
                    <tr>
                        <td class="fw-bold text-muted">#${log.logId}</td>
                        <td class="text-muted small">${formattedDate}</td>
                        <td><span class="badge ${badgeClass}">${log.actionType}</span></td>
                        <td><span class="badge bg-light text-dark border">${log.entityType || '-'}</span></td>
                        <td class="fw-semibold">${log.entityName || '-'}</td>
                        <td class="text-muted small">${log.details || '-'}</td>
                        <td><span class="badge bg-dark">${log.performedBy || 'Unknown'}</span></td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        document.getElementById('searchInput').addEventListener('input', renderLogs);

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            localStorage.removeItem('currentUser');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
