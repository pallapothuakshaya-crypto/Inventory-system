<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categories - IMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --sidebar-bg: #0f172a; --sidebar-hover: #1e293b; --primary-color: #3b82f6; --bg-color: #f1f5f9; --text-dark: #1e293b; --text-muted: #64748b; }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; color: var(--text-dark); }
        .sidebar { background-color: var(--sidebar-bg); color: #fff; height: 100vh; width: 260px; position: fixed; padding-top: 20px; overflow-y: auto; }
        .sidebar h4 { text-align: center; color: var(--primary-color); font-weight: 700; margin-bottom: 20px; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 11px 25px; display: flex; align-items: center; transition: 0.3s; font-size: 0.95rem; }
        .sidebar a:hover, .sidebar a.active { background-color: var(--sidebar-hover); color: #fff; border-left: 4px solid var(--primary-color); }
        .sidebar i { margin-right: 15px; font-size: 1.2rem; }
        .main-content { margin-left: 260px; padding: 40px; }
        .card-custom { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 25px; }
        .table thead th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.85rem; border-bottom: 2px solid #e2e8f0; padding: 15px; }
        .table tbody td { padding: 15px; vertical-align: middle; border-bottom: 1px solid #e2e8f0; }
        .table tbody tr:hover { background-color: #f8fafc; }
        .btn-primary-custom { background-color: var(--primary-color); border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; transition: 0.2s; }
        .btn-primary-custom:hover { background-color: #2563eb; transform: translateY(-2px); }
        .btn-action { border-radius: 6px; padding: 5px 10px; font-size: 0.85rem; }
        .search-box { border-radius: 8px; border: 1px solid #e2e8f0; padding: 10px 15px; width: 300px; }
        .search-box:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); outline: none; }
        .spinner-container { display: flex; justify-content: center; padding: 50px; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h4><i class="bi bi-box-seam"></i> IMS</h4>
        
        <div class="user-badge-box" style="background: rgba(255, 255, 255, 0.07); margin: 0 15px 25px 15px; padding: 12px; border-radius: 12px; text-align: center;">
            <div class="fw-bold text-white small" id="currentUserName">Admin</div>
            <span class="badge bg-danger mt-1" id="currentUserRole">ADMIN</span>
        </div>

        <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/products"><i class="bi bi-box"></i> Products</a>
        <a href="/orders"><i class="bi bi-cart-check"></i> Orders & Sales</a>
        <a href="/purchases"><i class="bi bi-bag-plus"></i> Purchases</a>
        <a href="/categories" class="active"><i class="bi bi-tags"></i> Categories</a>
        <a href="/suppliers"><i class="bi bi-truck"></i> Suppliers</a>
        <a href="/users"><i class="bi bi-people"></i> Users</a>
        <a href="/reports"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
        <a href="/history"><i class="bi bi-clock-history"></i> History</a>
        <hr style="border-color: #334155; margin: 15px 20px;">
        <a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Category Management</h2>
                <p class="text-muted mb-0">Manage your product categories</p>
            </div>
            <button class="btn btn-primary-custom text-white" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                <i class="bi bi-plus-lg"></i> Add Category
            </button>
        </div>

        <div class="card-custom">
            <div class="d-flex justify-content-between mb-4">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search categories...">
                <span class="text-muted align-self-center" id="recordCount">0 records</span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover" id="categoryTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Category Name</th>
                            <th>Description</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categoryTableBody"></tbody>
                </table>
            </div>
            <div id="loadingSpinner" class="spinner-container d-none">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px; border: none;">
                <div class="modal-header bg-light" style="border-radius: 16px 16px 0 0;">
                    <h5 class="modal-title fw-bold">Add New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addCategoryForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category Name</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="categoryDescription" rows="3"></textarea>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary-custom text-white">Save Category</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Category Modal -->
    <div class="modal fade" id="editCategoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px; border: none;">
                <div class="modal-header bg-light" style="border-radius: 16px 16px 0 0;">
                    <h5 class="modal-title fw-bold">Edit Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="editCategoryForm">
                        <input type="hidden" id="editCategoryId">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category Name</label>
                            <input type="text" class="form-control" id="editCategoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="editCategoryDescription" rows="3"></textarea>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary-custom text-white">Update Category</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let allCategories = []; // Store data locally for easier access

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const stored = localStorage.getItem('currentUser');
                if (stored) {
                    const u = JSON.parse(stored);
                    if (u.role !== 'ADMIN') {
                        window.location.href = '/products';
                        return;
                    }
                    const nameEl = document.getElementById('currentUserName');
                    if (nameEl) nameEl.textContent = u.username;
                } else {
                    window.location.href = '/login';
                    return;
                }
            } catch(e) {
                window.location.href = '/login';
                return;
            }
            loadCategories();
        });

        async function loadCategories() {
            const tableBody = document.getElementById('categoryTableBody');
            const spinner = document.getElementById('loadingSpinner');
            const table = document.getElementById('categoryTable');
            
            tableBody.innerHTML = '';
            table.classList.add('d-none');
            spinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/categories');
                allCategories = await response.json();
                
                spinner.classList.add('d-none');
                table.classList.remove('d-none');

                if (allCategories.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No categories found.</td></tr>';
                    document.getElementById('recordCount').textContent = '0 records';
                    return;
                }

                document.getElementById('recordCount').textContent = `${allCategories.length} records`;

                allCategories.forEach(category => {
                    const row = `
                        <tr>
                            <td class="fw-bold text-muted">#${category.categoryId}</td>
                            <td class="fw-semibold">${category.categoryName}</td>
                            <td class="text-muted">${category.description || '-'}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary btn-action me-1" onclick="openEditModal(${category.categoryId})">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteCategory(${category.categoryId})">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                spinner.classList.add('d-none');
                table.classList.remove('d-none');
                tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Failed to load data.</td></tr>';
            }
        }

        // --- ADD CATEGORY ---
        document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('categoryName').value;
            const description = document.getElementById('categoryDescription').value;

            try {
                const response = await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ categoryName: name, description: description })
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addCategoryModal')).hide();
                    document.getElementById('addCategoryForm').reset();
                    loadCategories();
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.error || 'Could not add category'));
                }
            } catch (error) { alert('Server error'); }
        });

        // --- EDIT CATEGORY ---
        function openEditModal(id) {
            const category = allCategories.find(c => c.categoryId === id);
            if (category) {
                document.getElementById('editCategoryId').value = category.categoryId;
                document.getElementById('editCategoryName').value = category.categoryName;
                document.getElementById('editCategoryDescription').value = category.description || '';
                new bootstrap.Modal(document.getElementById('editCategoryModal')).show();
            }
        }

        document.getElementById('editCategoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editCategoryId').value;
            const name = document.getElementById('editCategoryName').value;
            const description = document.getElementById('editCategoryDescription').value;

            try {
                const response = await fetch(`/api/categories/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ categoryName: name, description: description })
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('editCategoryModal')).hide();
                    loadCategories();
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.error || 'Could not update category'));
                }
            } catch (error) { alert('Server error'); }
        });

        // --- DELETE CATEGORY ---
        async function deleteCategory(id) {
            if (!confirm("Are you sure you want to delete this category?")) return;

            try {
                const response = await fetch(`/api/categories/${id}`, { method: 'DELETE' });
                
                if (response.ok) {
                    loadCategories();
                } else if (response.status === 409) { // Conflict (in use)
                    const err = await response.json();
                    alert('Cannot Delete: ' + err.error);
                } else {
                    alert('Error deleting category.');
                }
            } catch (error) { alert('Server error'); }
        }

        // Search
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchValue = this.value.toLowerCase();
            document.querySelectorAll('#categoryTableBody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(searchValue) ? '' : 'none';
            });
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        });
    </script>
</body>
</html>
